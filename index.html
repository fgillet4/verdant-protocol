<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verdant Protocol</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0f0a; overflow: hidden; font-family: 'Courier New', monospace; }
    #canvas-container { width: 100vw; height: 100vh; }

    /* ── HUD overlay ──────────────────────────────────────────────────────── */
    #hud {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; color: #c8e6c9;
    }

    /* ── Shared panel style ───────────────────────────────────────────────── */
    .panel {
      background: rgba(5, 12, 5, 0.82);
      border: 1px solid rgba(76, 175, 80, 0.25);
      border-radius: 8px; padding: 10px 14px;
      backdrop-filter: blur(4px);
    }
    .panel-label {
      font-size: 9px; letter-spacing: 0.18em; opacity: 0.45;
      text-transform: uppercase; margin-bottom: 6px;
    }

    /* ── Player HP (top-left) ─────────────────────────────────────────────── */
    #player-panel {
      position: absolute; top: 16px; left: 16px; min-width: 160px;
    }
    .hp-track {
      width: 130px; height: 8px;
      background: rgba(255,255,255,0.07); border-radius: 4px; overflow: hidden;
      margin-bottom: 4px;
    }
    .hp-fill {
      height: 100%; width: 100%; border-radius: 4px;
      background: linear-gradient(90deg, #1b5e20, #66bb6a);
      transition: width 0.12s ease;
    }
    .enemy-fill { background: linear-gradient(90deg, #7f0000, #ef5350); }
    .hp-text { font-size: 11px; opacity: 0.7; }

    /* ── Target HP (below minimap) ──────────────────────────────────────── */
    #target-panel {
      position: absolute; top: 196px; right: 16px; min-width: 160px;
      display: none; flex-direction: column;
    }
    #target-name { font-size: 11px; color: #ef9a9a; margin-bottom: 6px; }

    /* ── Minimap (top-right circular) ───────────────────────────────────── */
    #minimap-wrap {
      position: absolute; top: 16px; right: 16px;
      width: 160px; height: 160px; pointer-events: none;
    }
    #minimap-canvas {
      width: 160px; height: 160px; border-radius: 50%;
      border: 2px solid rgba(76,175,80,0.45);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.6), 0 4px 24px rgba(0,0,0,0.5),
                  inset 0 0 12px rgba(0,0,0,0.4);
      display: block;
    }
    #minimap-compass {
      position: absolute; top: 2px; left: 50%; transform: translateX(-50%);
      font-size: 8px; font-weight: bold; color: #ef5350;
      letter-spacing: 0.1em; pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }
    #minimap-hint {
      position: absolute; bottom: -16px; right: 0;
      font-size: 8px; opacity: 0.28; letter-spacing: 0.12em;
    }

    /* ── Full map modal ──────────────────────────────────────────────────── */
    #map-modal {
      position: absolute; inset: 0; background: rgba(0,0,0,0.82);
      display: none; align-items: center; justify-content: center;
      z-index: 800; pointer-events: none;
    }
    #map-modal.open { display: flex; pointer-events: auto; }
    #map-modal-inner {
      background: rgba(4,10,4,0.98);
      border: 1px solid rgba(76,175,80,0.3); border-radius: 8px;
      overflow: hidden; display: flex; flex-direction: column;
      box-shadow: 0 8px 48px rgba(0,0,0,0.7);
    }
    #map-modal-header {
      display: flex; align-items: center; padding: 10px 16px;
      border-bottom: 1px solid rgba(76,175,80,0.15);
      font-size: 10px; letter-spacing: 0.12em;
    }
    #map-modal-title { flex: 1; color: #76ff03; }
    #map-modal-close {
      cursor: pointer; opacity: 0.45; font-size: 14px;
      pointer-events: auto;
    }
    #map-modal-close:hover { opacity: 1; color: #ef5350; }
    #map-canvas {
      display: block;
      border: 1px solid rgba(76,175,80,0.12); border-left: none; border-right: none;
    }
    #map-legend {
      display: flex; gap: 14px; padding: 8px 16px;
      font-size: 9px; opacity: 0.55; letter-spacing: 0.06em; flex-wrap: wrap;
    }
    .map-legend-item { display: flex; align-items: center; gap: 5px; }
    .map-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    }

    /* ── Game panel (INV/EQ/SK/AT unified panel, built dynamically) ─────── */
    #game-panel::-webkit-scrollbar { width: 4px; }
    #game-panel::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    #game-panel::-webkit-scrollbar-thumb { background: rgba(76,175,80,0.35); border-radius: 2px; }

    /* ── Skill icon grid (OSRS-style 3-col) ─────────────────────────────── */
    #skill-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 3px; margin-bottom: 6px;
    }
    .skill-tile {
      position: relative;
      display: flex; flex-direction: column; align-items: center;
      padding: 5px 2px 4px;
      border: 1px solid rgba(255,255,255,0.06); border-radius: 5px;
      cursor: pointer; transition: background 0.1s, border-color 0.1s;
      background: rgba(0,0,0,0.2);
    }
    .skill-tile:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.18); }
    .skill-tile.tile-modal { cursor: context-menu; }
    .skill-icon {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: bold; letter-spacing: -0.02em;
      margin-bottom: 2px; flex-shrink: 0;
    }
    .skill-tile-name {
      font-size: 7.5px; opacity: 0.5; text-align: center;
      letter-spacing: 0.04em; text-transform: uppercase;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%;
    }
    .skill-tile-level {
      font-size: 13px; font-weight: bold; color: #e8f5e9; line-height: 1;
    }
    .skill-xp-pip {
      position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
      border-radius: 0 0 4px 4px; overflow: hidden; background: rgba(255,255,255,0.05);
    }
    .skill-xp-pip-fill {
      height: 100%; width: 0%; transition: width 0.35s ease;
    }

    /* ── Total level ────────────────────────────────────────────────────── */
    #skill-total {
      text-align: center; font-size: 9px; opacity: 0.38;
      border-top: 1px solid rgba(255,255,255,0.06); padding-top: 5px;
      letter-spacing: 0.1em;
    }

    /* ── Skill tooltip (hover) ──────────────────────────────────────────── */
    #skill-tooltip {
      position: fixed; z-index: 900; pointer-events: none;
      background: rgba(4,10,4,0.96); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px; padding: 7px 12px; font-size: 10px; color: #c8e6c9;
      white-space: nowrap; display: none; max-width: 240px; white-space: normal;
    }

    /* ── Level-up toast (centre screen) ──────────────────────────────────── */
    #levelup-toast {
      position: absolute; top: 38%; left: 50%; transform: translateX(-50%);
      background: rgba(3,8,3,0.96);
      border: 1px solid #ffd700; box-shadow: 0 0 24px rgba(255,215,0,0.25);
      border-radius: 10px; padding: 14px 28px; text-align: center;
      font-size: 15px; color: #c8e6c9; letter-spacing: 0.05em;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease;
      white-space: nowrap;
    }
    #levelup-toast .toast-congrats {
      font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
      color: #ffd700; opacity: 0.8; margin-bottom: 4px;
    }
    #levelup-toast.toast-show { opacity: 1; }
    #levelup-toast.toast-hide { opacity: 0; }

    /* ── Golden level-up flash ───────────────────────────────────────────── */
    #levelup-flash {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(255,215,0,0.18) 0%, transparent 70%);
      opacity: 0;
    }
    @keyframes levelup-pulse {
      0%   { opacity: 0; }
      15%  { opacity: 1; }
      100% { opacity: 0; }
    }
    .levelup-flash-anim { animation: levelup-pulse 0.8s ease-out forwards; }

    /* ── XP drop stack (top-right, OSRS style) ──────────────────────────── */
    #xp-drops {
      position: absolute; top: 16px; right: 192px;
      display: flex; flex-direction: column; align-items: flex-end;
      gap: 2px; pointer-events: none;
    }
    .xp-drop {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: #e8f5e9;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      animation: xp-drop-in 3.2s ease forwards;
    }
    .xp-drop-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    }
    @keyframes xp-drop-in {
      0%   { opacity: 0; transform: translateX(10px); }
      8%   { opacity: 1; transform: translateX(0); }
      75%  { opacity: 1; }
      100% { opacity: 0; transform: translateX(6px); }
    }

    /* ── Status bar (bottom-centre) ──────────────────────────────────────── */
    #status {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.55); padding: 7px 18px; border-radius: 20px;
      font-size: 12px; letter-spacing: 0.04em; opacity: 0.8;
    }

    /* ── Coords ───────────────────────────────────────────────────────────── */
    #coords {
      position: absolute; bottom: 42px; left: 16px;
      font-size: 10px; opacity: 0.3;
    }

    /* ── Click indicator ─────────────────────────────────────────────────── */
    #click-indicator {
      position: absolute; width: 22px; height: 22px;
      border: 2px solid #76ff03; border-radius: 50%;
      transform: translate(-50%, -50%); pointer-events: none; opacity: 0;
      transition: border-color 0s;
    }
    #click-indicator.click-action { border-color: #ef5350; }
    @keyframes click-pulse {
      0%   { transform: translate(-50%,-50%) scale(1);   opacity: 1; }
      100% { transform: translate(-50%,-50%) scale(2.5); opacity: 0; }
    }
    .click-pulse { animation: click-pulse 0.45s ease-out forwards !important; }

    /* ── Floating damage numbers ─────────────────────────────────────────── */
    #damage-numbers {
      position: absolute; inset: 0; pointer-events: none; overflow: hidden;
    }
    .damage-number {
      position: absolute; font-size: 20px; font-weight: bold;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.5);
      pointer-events: none; user-select: none;
      transform: translateX(-50%);
      animation: damage-float 0.9s ease-out forwards;
    }
    @keyframes damage-float {
      0%   { transform: translateX(-50%) translateY(0);     opacity: 1; }
      100% { transform: translateX(-50%) translateY(-70px); opacity: 0; }
    }

    /* ── Loot log (bottom-left, above coords) ───────────────────────────── */
    #loot-log {
      position: absolute; bottom: 56px; left: 16px;
      display: flex; flex-direction: column; gap: 3px;
      pointer-events: none;
    }
    .loot-entry {
      font-size: 11px; opacity: 1;
      transition: opacity 0.5s ease;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    /* ── Context menu ────────────────────────────────────────────────────── */
    #ctx-menu { pointer-events: auto; }
    #ctx-menu div:not(:first-child):hover { background: rgba(76,175,80,0.13); }

    /* ── Attunement bar (bottom-right) ──────────────────────────────────── */
    #attu-wrap { pointer-events: auto; }

    @keyframes attu-depleted {
      0%   { transform: scale(1.3); border-color: #ef5350 !important; }
      100% { transform: scale(1); }
    }

    /* ── Loading screen ──────────────────────────────────────────────────── */
    #loading {
      position: absolute; inset: 0; background: #0a0f0a;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px; transition: opacity 0.8s;
    }
    #loading h1 {
      color: #76ff03; font-size: 34px; font-weight: 300;
      letter-spacing: 0.3em; text-transform: uppercase;
    }
    #loading p { color: #4caf50; font-size: 12px; opacity: 0.55; letter-spacing: 0.1em; }
    #loading.hidden { opacity: 0; pointer-events: none; }

    /* ── Settings panel range inputs ─────────────────────────────────────── */
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance:none; appearance:none;
      width:14px; height:14px; border-radius:50%;
      background:#76ff03; cursor:pointer;
      box-shadow:0 0 4px rgba(118,255,3,0.4);
    }
    input[type=range]::-moz-range-thumb {
      width:14px; height:14px; border-radius:50%; border:none;
      background:#76ff03; cursor:pointer;
    }
    input[type=range]::-webkit-slider-runnable-track {
      height:4px; border-radius:2px;
      background:rgba(76,175,80,0.2);
    }
    input[type=range]:focus { outline:none; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="hud">

    <!-- Player HP -->
    <div id="player-panel" class="panel">
      <div class="panel-label">Vitality</div>
      <div class="hp-track"><div id="hp-fill" class="hp-fill"></div></div>
      <span id="hp-text" class="hp-text">100 / 100</span>
    </div>

    <!-- Target HP -->
    <div id="target-panel" class="panel">
      <div class="panel-label">Target</div>
      <div id="target-name">Drone Sentinel</div>
      <div class="hp-track"><div id="target-hp-fill" class="hp-fill enemy-fill"></div></div>
      <span id="target-hp-text" class="hp-text">50 / 50</span>
    </div>

    <!-- Skill hover tooltip (used by SkillPanelUI inside GamePanel) -->
    <div id="skill-tooltip"></div>

    <!-- Level-up toast -->
    <div id="levelup-toast"></div>

    <!-- Level-up golden screen flash -->
    <div id="levelup-flash"></div>

    <!-- XP drop stack (top-right, OSRS style) -->
    <div id="xp-drops"></div>

    <div id="loot-log"></div>
    <div id="coords"></div>
    <div id="status">Move: click · Attack: click drone · Camera: WASD · Skills: Tab · Inventory: I · Attunements: Z</div>
    <div id="click-indicator"></div>
    <div id="damage-numbers"></div>

  </div>

  <div id="loading">
    <h1>Verdant Protocol</h1>
    <p>Initialising world systems...</p>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
